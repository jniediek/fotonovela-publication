[project]
name = "figure-tools"
version = "0.1.0"
description = "Figure scripts for the fotonovela study"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johannes Niediek" }]
]
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
